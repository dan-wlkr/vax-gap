<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFB320">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Prototype for practice nurses planning catch-up vaccines when records are missing. Not for clinical use.">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>Vax Gap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Clinic paperwork: ink on cool paper, one yellow accent. Single centred form column, plan plus side actions on desktop. */
  --ink:#14233F; --paper:#ECEFF3; --bg:#ECEFF3; --surface:#FFFFFF; --card:#FFFFFF; --yellow:#FFD23F; --focus:#FFD23F;
  --on-ink:#FFFFFF; --on-ink-soft:rgba(255,255,255,.78);
  --red:#C3352B; --redbg:#FCEDEB; --amber:#9A5B00; --amberbg:#FFF4DE; --warn:#D9A400;
  --green:#1F7445; --greenbg:#E7F4EC; --grey:#5F6B80; --greybg:#E3E7ED; --line:#DCE2EC;
  --bar:#DCE2EA; --barline:#C9D1DD; --shadow:rgba(20,35,63,.25); --scrim:rgba(20,35,63,.45); --toast-link:#FFD23F;
  --colw:640px; --sitew:960px; --gutter:16px; color-scheme:light;
  --display:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; --body:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
/* no single words left alone on the last line */
p,li,dd,dt,label,legend,.lead,.hint,.small,td,th,blockquote{text-wrap:pretty}
h1,h2,h3,h4{text-wrap:balance}
body{margin:0;font-family:var(--body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;color:var(--ink);background:var(--paper);font-size:17px}
.app{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.wrap{width:100%;max-width:calc(var(--sitew) + 2 * var(--gutter));margin-inline:auto;padding-inline:var(--gutter)}
@media (min-width:641px){ :root{--gutter:30px} }

/* site bar */
.site{border-bottom:1px solid var(--line);background:var(--surface)}
.site .wrap{display:flex;align-items:center;gap:10px;min-height:56px;flex-wrap:wrap}
.mark{flex:none;width:18px;height:18px;border-radius:5px;background:var(--yellow);box-shadow:inset 0 -5px 0 rgba(20,35,63,.14)}
.site b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.site .proto{margin-left:auto;font-size:13px;color:var(--grey)}

/* yellow header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;transition:box-shadow .2s}
.topbar.scrolled{box-shadow:0 1px 0 var(--line),0 8px 16px -12px var(--shadow)}
@media (prefers-reduced-motion:reduce){.topbar{transition:none}}
/* yellow bar: navy wordmark, deep teal syringe so it holds contrast on yellow */
.appbar{--nav:#FFB320;--ink-nav:#111111;--teal:#111111;background:var(--nav);color:var(--ink-nav);box-shadow:inset 0 -1px 0 rgba(20,35,63,.12)}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans',var(--display);font-size:22px;line-height:1;color:var(--ink-nav)}
/* mark: four doses, one missing (the gap) */
.logo-mark{width:1.3em;height:1.3em;flex:none;fill:var(--nav)}
.logo-mark .badge{fill:var(--ink-nav)}
.logo-mark .gap-cell{fill:none;stroke:var(--nav);stroke-width:1.5}
.logo-text{font-weight:500;letter-spacing:-.03em}
.logo-text b{font-weight:800;letter-spacing:-.035em}
.appbar .wrap{display:flex;align-items:center;gap:24px;min-height:64px}
.brand{display:flex;align-items:center;padding:0;border:0;background:none;color:inherit;cursor:pointer;font:inherit}
.appbar-title{margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.045em;line-height:1;color:#14233F}
.appnav{margin-left:auto;margin-right:0;display:flex;align-self:stretch;gap:4px}
.appnav button{position:relative;display:flex;align-items:center;padding:0 12px;border:0;background:none;font:inherit;font-family:var(--display);font-size:15px;font-weight:500;color:rgba(17,17,17,.68);cursor:pointer;white-space:nowrap}
.appnav button:hover{color:var(--ink-nav)}
.appnav button[aria-current="page"]{color:var(--ink-nav);font-weight:700}
.appnav .nav-cta{align-self:center;margin-left:10px;padding:9px 16px;border-radius:8px;background:var(--ink);color:#FFFFFF;font-weight:600}
.appnav .nav-cta:hover{color:#FFFFFF;background:#22355A}
.appnav .nav-cta[aria-current="page"]{color:#FFFFFF;font-weight:600}
.appnav button:focus-visible,.brand:focus-visible{outline:2px solid var(--ink-nav);outline-offset:-2px;border-radius:6px}
/* burger menu on phones */
.appbar .wrap{position:relative}
.burger{display:none}
@media (max-width:640px){
  .burger{display:flex;flex-direction:column;justify-content:center;gap:5px;margin-left:auto;margin-right:-8px;width:44px;height:44px;padding:0 10px;border:0;background:none;cursor:pointer;border-radius:8px}
  .burger span{display:block;height:2px;background:var(--ink-nav);border-radius:2px;transition:transform .2s,opacity .2s}
  .burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .burger[aria-expanded="true"] span:nth-child(2){opacity:0}
  .burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .burger:focus-visible{outline:2px solid var(--ink-nav);outline-offset:-2px}
  .appnav{display:none;position:absolute;top:100%;left:0;right:0;margin:0;flex-direction:column;gap:0;background:var(--nav);border-top:1px solid rgba(20,35,63,.12);box-shadow:0 12px 20px -12px rgba(20,35,63,.45);padding:4px 0 10px}
  .appnav.open{display:flex}
  .appnav button{padding:14px var(--gutter);font-size:17px;justify-content:flex-start}
  .appnav button[aria-current="page"]{background:rgba(255,255,255,.3);box-shadow:inset 4px 0 0 var(--ink-nav)}
  .appnav .nav-cta,.appnav .nav-cta[aria-current="page"]{align-self:stretch;justify-content:center;margin:10px var(--gutter) 4px;padding:14px 16px;border-radius:8px;background:var(--ink);color:#FFFFFF;box-shadow:none}
  .logo{font-size:20px}
}
@media (prefers-reduced-motion:reduce){ .burger span{transition:none} }
.sheet > .appbar{flex:none}

.is-info #nav,.is-info #actionBar{display:none!important}

/* form steps sit in a white card: header row with the question, body with the inputs */
.page-title{text-align:center;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.03em;line-height:1.15;margin:0 0 26px;text-wrap:balance}
.is-card main{--cp:40px;max-width:var(--sitew);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px var(--cp) 32px;box-shadow:0 1px 2px rgba(20,35,63,.04)}
.is-card main legend.head{display:block;float:left;width:calc(100% + 2 * var(--cp));margin:0 calc(-1 * var(--cp)) 24px;padding:26px var(--cp) 22px;border-bottom:1px solid var(--line)}
.is-card main legend.head + *{clear:both}
.is-card main > h1:first-child + *{clear:both}
.is-card main > .group:first-child legend.head{margin-top:-28px}
.is-card main legend.head h1{margin:0;font-size:24px}
.is-card main > h1:first-child{font-size:24px;margin-bottom:24px}
.is-card main .caption{font-size:14px;margin-bottom:4px}
.is-card main .hint{margin:0 0 18px;max-width:640px}
.is-card .radios,.is-card .date,.is-card .callout,.is-card .err-msg{max-width:640px}
.is-card .group.error:not(.inner){border-left:0;padding-left:0}
.is-card .group.error:not(.inner) fieldset > :not(legend){border-left:5px solid var(--red);padding-left:15px}
.is-card .group.error:not(.inner) fieldset > :not(legend):not(:last-child){margin-bottom:0;padding-bottom:16px}
.is-card .group.error:not(.inner) fieldset > :last-child{margin-bottom:28px;padding-bottom:4px}
.is-card .summary-err{margin:0 0 20px;max-width:none}
.is-card main .btn{margin-bottom:0}
@media (max-width:640px){ .is-card main{--cp:20px;padding-top:22px} .is-card main > .group:first-child legend.head{margin-top:-22px} .page-title{font-size:24px;margin-bottom:20px} }

.q-legend{display:block;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.3;margin-bottom:12px}
.group.inner + .group.inner{margin-top:12px}
.is-card .group.inner.error{border-left:5px solid var(--red);padding-left:15px;margin-bottom:24px}
.is-card .group.inner .radios{margin-bottom:24px}

.last-dose{margin:4px 0 24px;padding-top:22px;border-top:1px solid var(--line);max-width:640px}
.last-dose .opt{font-weight:400;color:var(--grey)}
.reveal{margin:-8px 0 24px 18px;padding:4px 0 4px 26px;border-left:4px solid var(--line);max-width:640px}
.radios .reveal{margin:4px 0 16px 18px}
.q-sub{font-weight:700;font-size:17px;margin:12px 0 6px}
.dgroup + .dgroup{margin-top:4px}
.dgroup .date{margin-bottom:16px}
.dgroup.error{border-left:5px solid var(--red);padding-left:15px;margin-left:-20px}
.reveal .dgroup.error{margin-left:-30px;padding-left:26px}
.dgroup.error .date input{border-color:var(--red)}

.vrow .due{display:block;font-size:13px;font-weight:700;margin-top:6px}
/* home: full-bleed hero, photo in a soft blob, cards overlap its bottom edge */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#E4F3EE 0%,#DCEBF7 100%)}
.hero-inner{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(40px,5vw,80px);align-items:center;padding-block:40px 104px}
.hero-copy{max-width:580px}
.hero h1{font-family:var(--display);font-size:clamp(40px,3.8vw,56px);line-height:1.04;letter-spacing:-.035em;margin:0 0 16px;text-wrap:balance}
.hero .lead{font-size:clamp(18px,1.4vw,20px);line-height:1.5;color:#33415C;margin:0 0 28px}
.hero .btn.hero-btn{width:auto;display:inline-block;margin:0;padding:14px 28px;font-size:17px;box-shadow:0 6px 16px -8px rgba(20,35,63,.6)}
.hero-media{order:-1;position:relative;aspect-ratio:1/1;width:100%;max-height:min(720px,calc(100vh - 150px));min-height:480px}
.hero-photo{position:absolute;inset:0;overflow:hidden;border-radius:24px;border:1px solid var(--line);background:linear-gradient(140deg,#CDE6F2,#BFE3D6)}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:62% 50%;display:block}
.hero-ph{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:600;color:rgba(20,35,63,.45);letter-spacing:.04em;text-transform:uppercase}

.is-home #heroSlot{flex:1;display:flex}
.is-home .hero{flex:1;display:flex;align-items:center;background:none}
.is-home .hero-inner{padding-block:48px 40px}
.is-home .layout{flex:none;padding-block:0 40px}
.is-home main{max-width:none}
.is-home .wrap{max-width:calc(1240px + 2 * var(--gutter))}
/* app bar: same width on every page */
.appbar .wrap{max-width:calc(1240px + 2 * var(--gutter))}
@media (min-width:821px){ .appbar{--gutter:40px} }
@media (min-width:821px){ .is-home{--gutter:40px} .info .home-points h2{font-size:18px} .home-points section{padding:24px} .home-points p{font-size:16px} }
.home-points{position:relative;z-index:1;margin-top:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.home-points section{display:flex;gap:14px;align-items:flex-start;background:#FFFFFF;border:1px solid var(--line);border-radius:16px;padding:20px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hp-ico{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.hp-ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hp-ico.c1{background:#FFE3A1}.hp-ico.c2{background:#BFE3D6}.hp-ico.c3{background:#FFD5C8}
.info .home-points h2{margin:0 0 6px;font-size:17px}
.home-points p{margin:0;font-size:15px;line-height:1.45;color:#46536B}
.home-points .linkbtn{font-size:15px}
.home-banner{display:flex;gap:8px;align-items:flex-start;margin-top:0;padding:0}
.home-banner p{margin:0;font-size:13.5px;line-height:1.5;color:var(--grey);max-width:none}
.hb-ast{margin-right:2px}
.hero-float{position:absolute;left:20px;bottom:20px;max-width:380px;display:flex;gap:12px;align-items:flex-start;background:#FFFFFF;border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(20,35,63,.08),0 12px 32px -10px rgba(20,35,63,.35)}
.hero-float h2{margin:0 0 4px;font-size:16px;line-height:1.3}
.hero-float p{margin:0;font-size:14.5px;line-height:1.45;color:#46536B}
.hero-float .linkbtn{font-size:14.5px}
.hero-float .hp-ico{width:36px;height:36px}
@media (max-width:820px){ .hero-media{margin-bottom:52px} .hero-float{left:12px;right:12px;bottom:0;transform:translateY(62%);max-width:none;padding:12px 14px;gap:10px;border-radius:14px} .hero-float .hp-ico{width:32px;height:32px} .hero-float .hp-ico svg{width:17px;height:17px} .hero-float h2{font-size:15px;margin-bottom:2px} .hero-float p,.hero-float .linkbtn{font-size:13.5px} }

.home-banner{scroll-margin-bottom:24px;outline:none;border-radius:6px}
.home-banner.flash{animation:fnflash 1.6s ease-out}
@keyframes fnflash{0%,30%{background:#FFE7A8;box-shadow:0 0 0 8px #FFE7A8}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion:reduce){.home-banner.flash{animation:none}}
.hero h1 .fn{color:inherit;text-decoration:none;font-weight:700;margin-left:1px;padding:0 1px;border-radius:4px}
.hero h1 .fn:hover{color:#B26F00}
.hero h1 .fn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* desktop: whole home page fits in one screen, photo takes the spare height */
@media (min-width:821px) and (min-height:640px){
  .is-home.app{height:100vh;height:100dvh;min-height:0}
  .is-home #heroSlot{min-height:0}
  .is-home .hero{min-height:0;align-items:stretch}
  .is-home .hero-inner{height:100%;grid-template-rows:minmax(0,1fr);padding-block:28px 20px}
  .is-home .hero-media{aspect-ratio:auto;height:100%;max-height:none;min-height:0}
  .is-home .hero-copy{align-self:center}
  .is-home .layout{padding-block:0 28px}
  .is-home .home-points{gap:12px}
  .is-home .home-points section{padding:16px 18px}
  .is-home .hp-ico{width:36px;height:36px}
  .is-home .home-points p{font-size:15px}
  .is-home .home-banner{margin-top:0}
}
@media (max-width:820px){
  .home-points{grid-template-columns:minmax(0,1fr);gap:12px}
}
@media (max-width:820px){
  .hero-inner{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:32px 40px}
  .is-home .hero-inner{padding-block:32px 28px}
  .hero-copy{max-width:560px}
  .hero-media{order:-1;width:100%;aspect-ratio:3/2;max-height:none;min-height:0;margin-top:4px}
  .hero-photo{border-radius:20px}
  .hero-photo img{object-position:50% 35%}
}
@media (max-width:640px){
  .is-home .hero-inner{gap:20px;padding-block:24px 24px}
  .hero h1{font-size:30px;margin-bottom:12px}
  .hero .lead{font-size:16px;margin-bottom:20px}
  .hero .btn.hero-btn{width:100%;padding-block:15px}
  .is-home .layout{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .home-points{gap:0;background:#FFFFFF;border:1px solid var(--line);border-radius:16px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden}
  .home-points section{background:none;border:0;border-radius:0;padding:16px;-webkit-backdrop-filter:none;backdrop-filter:none}
  .home-points section + section{border-top:1px solid var(--line)}
  .hp-ico{width:34px;height:34px}
  .hp-ico svg{width:18px;height:18px}
  .info .home-points h2{font-size:16px;margin-bottom:4px}
  .home-points p,.home-points .linkbtn{font-size:14.5px}
}
/* about and updates */
.info h1{margin-bottom:12px}
.info .lead{font-size:18px;color:var(--grey);line-height:1.5;margin:0 0 28px;max-width:34em}
.info h2{font-family:var(--display);font-size:19px;margin:32px 0 10px}
.info p,.info li{line-height:1.55}
.info ul{padding-left:20px;margin:0 0 18px}
.info li{margin-bottom:6px}
.info .more-list{list-style:none;margin:0 0 8px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.info .more-list li{margin:0}
.more-list li + li{border-top:1px solid var(--line)}
.more-link{display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px;border:0;background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.more-link:hover{background:#F6F8FA}
.more-link:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.more-link > span{flex:1;min-width:0}
.more-link b{display:block;font-size:17px;margin-bottom:2px}
.more-link > span > span{display:block;color:var(--grey);font-size:15px;line-height:1.4}
.more-chev{flex:none;width:20px;height:20px;fill:none;stroke:var(--grey);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub-back{margin:0 0 24px}
.info .qg-title{font-size:24px;letter-spacing:-.02em;margin:40px 0 4px}
.info .sch-h{font-family:var(--display);font-size:18px;margin:24px 0 10px}
.is-schedule main{max-width:none}
.gov-related{background:var(--card);border:2px solid #1d70b8;border-radius:14px;padding:20px 24px 22px;margin:20px 0 8px;box-shadow:0 1px 2px rgba(20,35,63,.06),0 10px 24px -14px rgba(20,35,63,.3)}
.info .gov-related h2{font-size:22px;margin:0 0 14px}
.info .gov-related ul{list-style:none;padding:0;margin:0}
.info .gov-related li{margin:0;padding:12px 0;border-top:1px solid var(--line)}
.info .gov-related li:last-child{padding-bottom:0}
.info .gov-related li p{margin:4px 0 0;color:#46536B;font-size:15px;line-height:1.45}
.info .gov-related a{color:#1d70b8;text-decoration:underline;text-decoration-thickness:max(1px,.0625rem);text-underline-offset:.15em;font-size:19px;font-weight:600}
.info .gov-related a:visited{color:#4c2c92}
.info .gov-related a:hover{color:#003078;text-decoration-thickness:max(3px,.1875rem)}
.info .gov-related a:focus-visible{outline:3px solid transparent;color:#0b0c0c;background:var(--focus);box-shadow:0 -2px var(--focus),0 4px #0b0c0c;text-decoration:none}
.info .sch{list-style:none;margin:0 0 8px;padding:0;border-top:1px solid var(--line)}
.info .sch > li{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;padding:14px 0;margin:0;border-bottom:1px solid var(--line)}
.sch-age{font-weight:700;font-family:var(--display)}
.info .sch-items{list-style:none;margin:0;padding:0}
.info .sch-items li{margin:0 0 10px;display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr);gap:16px;align-items:baseline}
.info .sch-items li:last-child{margin-bottom:0}
.sch-items b{display:block;line-height:1.4}
.sch-items .sch-for{display:block;color:#46536B;font-size:14px;line-height:1.4;margin-top:2px}
.sch-items span{display:block;color:#46536B;font-size:16px;line-height:1.45}
@media (max-width:640px){ .info .sch > li{grid-template-columns:1fr;gap:6px} .sch-age{font-size:14px;color:var(--amber)} .info .sch-items li{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px} }
.info .log{list-style:none;margin:0 0 8px;padding:0;border-top:1px solid var(--line)}
.info .log li{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line);margin:0}
.log time{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;padding-top:2px}
.log b{display:block;margin-bottom:2px}
.log span{font-size:15px;color:var(--grey);line-height:1.5}
.log .soon time{color:var(--amber)}
@media (max-width:480px){ .info .log li{grid-template-columns:1fr;gap:4px} }
.info a{color:var(--ink);font-weight:700}
#nav{background:rgba(236,239,243,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding-block:18px 16px}
#nav.empty{display:none}
.sheet > header{flex:none;padding-block:16px 14px;border-bottom:1px solid var(--line);padding-inline:max(var(--gutter),calc((100% - var(--sitew))/2))}
.top-row{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.top-new{color:var(--grey)!important;font-weight:500!important}
.top-new:hover{color:var(--ink)!important}

<script>
// UK routine schedule from Jan 2026. Ages in weeks. Simplified catch up rules for the POC.
// Sources:
// UKHSA, Complete routine immunisation schedule from 1 September 2026
// UKHSA, Vaccination of individuals with uncertain or incomplete immunisation status (updated 1 October 2026)
// Ages in weeks. Rules are simplified from the UKHSA algorithm for a prototype.
// All dates are UTC midnight timestamps, so adding days never drifts across clock changes.
// The day a vaccine is given is day 0. A 4 week gap means the next dose is due on day 28.
const DAY = 864e5, WEEK = 7*DAY;
const todayUTC = ()=>{ const n=new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); };
const isoUTC = s=>{ const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d); };
// Calendar months: 31 Jan + 1 month = 1 Mar (no 31 Feb), 29 Feb + 12 months = 1 Mar
function addMonths(t,n){ const d=new Date(t), day=d.getUTCDate(); const r=Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+n, day); return new Date(r).getUTCDate()===day ? r : Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+n+1, 1); }
const addDays = (t,n)=> t + n*DAY;
// Ages as exact weeks from date of birth (fractional weeks are whole days)
const mo = n=> (addMonths(state.dob.getTime(), n) - state.dob.getTime())/WEEK;
const yr = n=> mo(12*n);
// School year N starts on 1 September after they turn N+4 (Year 8: age 12 on 31 August, Year 9: age 13)
const schoolYearStart = n=>{ const d=new Date(state.dob.getTime()), y=d.getUTCFullYear()+n+4+(d.getUTCMonth()>=8?1:0); return Date.UTC(y,8,1); };
const schoolYr = n=> (schoolYearStart(n) - state.dob.getTime())/WEEK;
// Flu season runs 1 September to 31 March. Eligibility uses age on 31 August at the start of the season.
const fluSeasonStart = ()=>{ const n=new Date(todayUTC()); return n.getUTCMonth()>=8 ? n.getUTCFullYear() : n.getUTCFullYear()-1; };
const inFluSeason = ()=>{ const m=new Date(todayUTC()).getUTCMonth(); return m>=8 || m<=2; };
const ageOn = t=>{ const d=new Date(state.dob.getTime()), x=new Date(t); let a=x.getUTCFullYear()-d.getUTCFullYear(); if(x.getUTCMonth()<d.getUTCMonth() || (x.getUTCMonth()===d.getUTCMonth() && x.getUTCDate()<d.getUTCDate())) a--; return a; };
const ord = n=> ['','1st','2nd','3rd','4th','5th'][n] || n+'th';
const SOURCES = [
  {title:'Vaccination of individuals with uncertain or incomplete immunisation status (UKHSA, updated 1 October 2026)',
   url:'https://www.gov.uk/government/publications/vaccination-of-individuals-with-uncertain-or-incomplete-immunisation'},
  {title:'MenB time-limited vaccination offer: information for healthcare practitioners (UKHSA, updated 20 July 2026)',
   url:'https://www.gov.uk/government/publications/meningococcal-b-menb-time-limited-vaccination-offer-information-for-healthcare-practitioners'},
  {title:'MMRV vaccination: information for healthcare professionals (UKHSA, updated 25 August 2026)',
   url:'https://www.gov.uk/government/publications/mmrv-programme-information-for-healthcare-practitioners/mmrv-vaccination-information-for-healthcare-professionals'},
  {title:'Complete routine immunisation schedule from 1 September 2026 (UKHSA)',
   url:'https://www.gov.uk/government/publications/the-complete-routine-immunisation-schedule'},
];
const bornFrom = iso => state.dob >= new Date(iso);
const bornBefore = iso => state.dob < new Date(iso);

const V = [
  {id:'hex', name:'6-in-1', what:'Diphtheria, tetanus, whooping cough, polio, Hib, hepatitis B', get sched(){ return [8,12,16]; },
    when:'8, 12 and 16 weeks, then 18 months for children born from July 2024',
    aka:'DTaP/IPV/Hib/HepB, hexavalent, Infanrix hexa, Vaxelis',
    tip:'Count any vaccine with diphtheria, tetanus and polio. Oral polio (OPV) given since April 2016 doesn\'t count for polio.',
    rule(a,g){
      // From 10th birthday: Td/IPV x3, first booster about 5 years later
      if(a>=yr(10)){
        const r = g>=3 ? {status:'done'} : {status:'missing', missing:3-g};
        return {...r, name:'Td/IPV', what:'Tetanus, diphtheria, polio', note: g<3 ? 'From age 10, Td/IPV replaces 6-in-1. First booster about 5 years after the course.' : undefined};

      if(a>=mo(12) && g<3) return {status:'missing', missing:3-g, note: a>=yr(2) ? 'Resume the course, no need to restart.' : undefined};

    }},
  {id:'rota', name:'Rotavirus', what:'Rotavirus (sickness and diarrhoea)', get sched(){ return [8,12]; },
    when:'8 and 12 weeks', aka:'Rotarix, RotaTeq',
    rule(a,g){
      if(g>=2) return {status:'done'};
      if(a>=24) return {status:'na', note:'Second dose can only be given before 24 weeks old.'};
      if(a>=15 && g===0) return {status:'na', note:'First dose can only be given before 15 weeks old.'};
      return gen(this.sched,a,g);
    }},
  {id:'menb', name:'MenB', what:'Meningitis B', get sched(){ return [8,12,mo(12)]; },
    when:'8 and 12 weeks, then 1 year', aka:'Bexsero, Trumenba',
    rule(a,g){
      if(a>=yr(2)) return g>=3 ? {status:'done'} : {status:'na', note:'The infant MenB course isn\'t offered from age 2.'};
      // 1 to 2 years: fewer than 2 infant doses means 2 doses in the second year, 4 weeks apart
      if(a>=mo(12)){
        if(g>=3) return {status:'done'};
        return {status:'missing', missing: g>=2 ? 1 : 2, note: g<2 ? 'Fewer than 2 doses before their first birthday, so 2 doses now, 4 weeks apart.' : undefined};
      }
      return gen(this.sched,a,g);
    }},
  {id:'pcv', name:'Pneumococcal (PCV)', what:'Pneumonia, meningitis, sepsis', get sched(){ return [16,mo(12)]; },
    when:'16 weeks and 1 year', aka:'Prevenar 13, PCV13, PCV15, PCV20',
    tip:'PCV10 (Synflorix) given abroad doesn\'t count. Leave it out.',
    rule(a,g){
      if(a>=yr(2)) return g>=2 ? {status:'done'} : {status:'na', note:'Not routinely offered from age 2.'};
      // 1 to 2 years: one dose needed over age 1
      if(a>=mo(12)) return g>=2 ? {status:'done'} : {status:'missing', missing:1, note: g===0 ? 'One dose is enough from age 1.' : undefined};

    }},
  {id:'mmrv', name:'MMR and MMRV', what:'Measles, mumps, rubella, chickenpox', get sched(){ return [mo(12),mo(18)]; },
    question:'Which measles vaccines are on the record?',
    when:'1 year and 18 months for children born from 2025. Older children may have had MMR, with MMRV later',
    cohortText(){
      if(bornBefore('2020-01-01')) return 'Born before 2020: 2 doses of MMR. Not eligible for MMRV.';
      if(bornBefore('2022-09-01')) return 'Born January 2020 to August 2022: MMR at 1 year and 3 years 4 months, plus one MMRV in the chickenpox catch-up from November 2026 to March 2028.';
      if(bornBefore('2024-07-01')) return 'Born September 2022 to June 2024: MMR at 1 year, then one MMRV at 3 years 4 months.';
      if(bornBefore('2025-01-01')) return 'Born July to December 2024: MMR at 1 year, then MMRV at 18 months and 3 years 4 months.';
      return 'Born from January 2025: MMRV at 1 year and 18 months.';
    },
    aka:'MMR (Priorix, M-M-RvaxPro), MMRV (ProQuad, Priorix-Tetra)',
    tip:'Only count doses given from their first birthday. A chickenpox vaccine given with MMR counts as MMRV.',
    // value is {mmr, mmrv} or '?'
    options:[['0-0','None'],['1-0','1 dose of MMR'],['2-0','2 doses of MMR'],['0-1','1 dose of MMRV'],['0-2','2 doses of MMRV'],
             ['1-1','1 MMR and 1 MMRV'],['1-2','1 MMR and 2 MMRV'],['2-1','2 MMR and 1 MMRV']],
    label(g){ if(g==='?'||g===undefined) return doseLabel(g); const o=this.options.find(o=>o[0]===`${g.mmr}-${g.mmrv}`); return o?o[1]:'None'; },
    rule(a,g){
      if(typeof g!=='object') g={mmr:0,mmrv:0};
      const T = g.mmr+g.mmrv, Vd = g.mmrv, today = todayUTC();
      // Cohorts from UKHSA MMRV guidance, tables 1 and 2
      const cohort = bornBefore('2020-01-01') ? 'E' : bornBefore('2022-09-01') ? 'D' : bornBefore('2024-07-01') ? 'C' : bornBefore('2025-01-01') ? 'B' : 'A';
      const mmr = cohort==='E';
      const base = mmr ? {name:'MMR', what:'Measles, mumps, rubella'} : {name:'MMRV', what:'Measles, mumps, rubella, chickenpox'};
      const NOW = {w:0};
      let D = [], note;
      const CU_START = '2026-11-01', CU_END = isoUTC('2028-03-31');
      const catchUp = {date:CU_START, name:'MMRV (chickenpox catch-up)', note:'Selective catch-up runs 1 November 2026 to 31 March 2028. Offer unless they\'ve had chickenpox or 2 chickenpox vaccines. No need to check history.'};

      if(a<mo(12)) D = mmr ? [] : [{w:mo(12)},{w:mo(18)}];
      else if(cohort==='E'){                       // born before 2020: 2 MMR
        if(bornBefore('1970-01-01') && T<2) return {...base, status:'na', note:'Most people born before 1970 are immune. Offer MMR if they ask or are at risk.'};
        D = Array(Math.max(0,2-T)).fill(NOW).map(x=>({...x}));
        if(D.length) note = 'Born before 2020, so MMR rather than MMRV. Doses at least 4 weeks apart.';
      }
      else if(cohort==='A'){                       // born from 1 Jan 2025: MMRV at 12 and 18 months
        D = [{w:mo(12)},{w:mo(18)}].slice(Math.min(2,Vd));
        if(g.mmr && Vd<2) note = 'MMR given abroad doesn\'t replace MMRV. Give MMRV at least 4 weeks after it.';
      }
      else if(cohort==='B'){                       // born Jul to Dec 2024
        D = g.mmr ? [{w:mo(18)},{w:mo(40)}].slice(Math.min(2,Vd)) : [{w:mo(12)},{w:mo(18)}].slice(Math.min(2,Vd));
        if(g.mmr && Vd<2) note = 'Born July to December 2024. After MMR at 12 months they get MMRV at 18 months and 3 years 4 months.';
      }
      else if(cohort==='C'){                       // born Sep 2022 to Jun 2024: MMR 12m, MMRV 3y4m
        if(T===0){ D = [NOW,{w:mo(40)}]; note = 'Second dose at 3 years 4 months, in line with their birth cohort.'; }
        else if(T===1) D = [{w:mo(40)}];
        else if(Vd===0){ D = [{w:mo(40)}]; note = 'Their birth cohort gets one MMRV at 3 years 4 months, even after 2 MMR.'; }
      }
      else {                                        // cohort D, born Jan 2020 to Aug 2022
        const open = today <= CU_END;
        if(T===0){ D = [NOW,NOW]; note = 'Two MMRV doses at least 4 weeks apart. No catch-up dose needed after this.'; }
        else if(T===1){ D = [NOW]; if(open && Vd+1<2) D.push(catchUp); }
        else if(Vd<2 && open) D = [catchUp];
      }
      if(!D.length) return {...base, status: a<mo(12) ? 'upcoming' : 'done'};
      const due = d=> d.w===0 || (d.w!==undefined && d.w<=a) || (d.date && isoUTC(d.date)<=today);
      const n = D.filter(due).length, tot = T + D.length;
      // e.g. "MMRV (2nd of 3 measles doses)", so a first MMRV after an MMR isn't shown as "Dose 2"
      D = D.map((d,ix)=> d.name ? {...d, pill:'Catch-up'} : {...d, name:`${base.name} (${ord(T+ix+1)} of ${tot} measles doses)`, pill:''});
      return {...base, note, status: n ? 'missing' : 'upcoming', missing:n, doses:D};
    }},
  {id:'pre', name:'4-in-1 pre-school booster', what:'Diphtheria, tetanus, whooping cough, polio', get sched(){ return [mo(40)]; },
    when:'3 years 4 months', aka:'dTaP/IPV, Repevax, Boostrix-IPV',
    rule(a,g){
      if(a>=yr(10) && g<1) return {status:'na', note:'Covered by Td/IPV from age 10.'};
      return gen(this.sched,a,g);
    }},
  {id:'hpv', name:'HPV', what:'Cancers caused by HPV', school:8, get sched(){ return [schoolYr(8)]; },
    when:'school Year 8, age 12 to 13', aka:'Gardasil 9, Gardasil, Cervarix', tip:'Any dose given from age 9 counts. One dose is enough.',
    rule(a,g){
      if(g>=1) return {status:'done'};
      if(a>=yr(25)) return {status:'na', note:'The routine programme stops at the 25th birthday.'};

      if(r.status==='missing') r.note = 'Eligible until their 25th birthday. Males born before 1 September 2006 aren\'t eligible.';
      return r;
    }},
  {id:'td', name:'Teenage booster (Td/IPV)', what:'Tetanus, diphtheria, polio', school:9, get sched(){ return [schoolYr(9)]; },
    when:'school Year 9, age 13 to 14', aka:'Td/IPV, Revaxis',
    rule(a,g){return gen(this.sched,a,g)}},
  {id:'acwy', name:'MenACWY', what:'Meningitis A, C, W and Y', school:9, get sched(){ return [schoolYr(9)]; },
    when:'school Year 9, age 13 to 14', aka:'MenQuadfi, Nimenrix, Menveo', tip:'Any dose given from age 10 counts.',
    rule(a,g){
      if(g>=1) return {status:'done'};
      if(a>=yr(25)) return {status:'na', note:'Eligible only until the 25th birthday.'};
      const r = gen(this.sched,a,g);
      if(r.status==='missing') r.note = 'Eligible until their 25th birthday.';
      return r;
    }},
  {id:'menbteen', name:'MenB (2026 offer)', what:'Meningitis B', get sched(){ return [yr(16)]; },
    custom:'menb', blank:{type:'unknown', dates:[]}, count:g=>(g.dates||[]).length,
    label(g){ if(g==='?'||g===undefined) return doseLabel(g); if(g.type==='none') return 'None';
      return (g.type==='bexsero'?'Bexsero':'Trumenba')+': '+g.dates.map(t=>fmt(t)).join(', '); },
    rule(a,g){
      const T0 = todayUTC(), FIRST_END = isoUTC('2026-12-31'), SECOND_END = isoUTC('2027-03-31');
      const BY1 = '2026-12-31', BY2 = '2027-03-31';
      const y13 = !bornBefore('2007-09-01') && bornBefore('2008-09-01');
      const herfe = !y13 && !bornBefore('2001-07-21') && a>=yr(16) && a<yr(25);
      if(!y13 && !herfe) return {status:'hidden'};
      const who = y13 ? 'Offered to everyone born 1 September 2007 to 31 August 2008.'
                      : 'Only if they are starting university, or further education in residential accommodation, for the first time in autumn 2026.';
      const ds = (g.dates||[]).slice().sort((x,y)=>x-y), last = ds[ds.length-1];
      const plan = (brand, start, doses, note)=> ({cond:!y13, name:`MenB (${brand})`, startDose:start, status:'missing', missing:1, doses, note:`${note} ${who}`});
      // a full course; Bexsero is the vaccine supplied for this offer. Same brand for both doses.
      const course = (from, why)=> T0>FIRST_END ? {status:'hidden'}
        : plan('Bexsero', 0, [{date:Math.max(T0, from||0), by:BY1},{gapD:28, by:BY2}], `${why} Bexsero is supplied for this offer. Use the same brand for both doses.`);

          if(T0>FIRST_END) return {status:'hidden'};
          return plan('Bexsero', 2, [{date:T0, by:BY1}], `Course completed on ${fmt(valid[1])}, 5 or more years ago. UKHSA: a single dose can be offered now.`);

          return plan('Trumenba', 1, [{date:addDays(ds[0],28), by:BY2},{gapM:4, name:'MenB (Trumenba)', by:BY2}],

      }
      return course(T0, g.type==='none' ? 'No previous MenB vaccine, so 2 doses.' : 'No record, so 2 doses.');
    }},
  {id:'flu', name:'Flu (nasal spray)', what:'Flu', noAsk:true, get sched(){ return [yr(2)]; },

        note:`For children aged 2 or 3 on 31 August ${y}. Given by the GP practice as a nasal spray (Fluenz). Check it hasn't already been given this season.`};
    }},
  {id:'pneumo65', name:'Pneumococcal (65 and over)', what:'Pneumonia, meningitis, sepsis', get sched(){ return [yr(65)]; },
    when:'65 years', aka:'PPV23, Pneumovax 23, PCV20, Prevenar 20',
    rule(a,g){ return gen(this.sched,a,g); }},
  {id:'shingles', name:'Shingles', what:'Shingles', get sched(){ return [yr(65)]; },
    when:'65 years, or anyone aged 70 to 79', aka:'Shingrix, Zostavax',
    tip:'Two doses of Shingrix, 6 to 12 months apart. Zostavax given before counts as done.',
    rule(a,g){
      if(g>=2) return {status:'done'};
      if(a>=yr(80)) return {status:'na', note:'Eligibility ends at the 80th birthday.'};
      const eligibleNow = (a>=yr(65) && !bornBefore('1958-09-01')) || a>=yr(70);
      if(!eligibleNow){
        if(a>=yr(65)) return {status:'upcoming', doses:[{w:yr(70)},{gapM:6}].slice(g)};
        return {status:'upcoming', doses:[{w:yr(65)},{gapM:6}].slice(g)};
      }
      return {status:'missing', missing: g===0?1:1, doses:[{w:0},{gapM:6}].slice(g), note:'Second dose 6 to 12 months after the first.'};
    }},
  {id:'rsv', name:'RSV', what:'Respiratory syncytial virus', get sched(){ return [yr(75)]; },
    when:'From 75 years', aka:'Abrysvo, Arexvy',
    rule(a,g){ return gen(this.sched,a,g); }},
];

function gen(sched,a,g){
  const due = sched.filter(w=>w<=a).length;
  if(g>=sched.length) return {status:'done'};
  // future: ages (weeks) of the remaining routine doses after any catch up
  if(g<due) return {status:'missing', missing:due-g, future: sched.slice(due)};
  return {status:'upcoming', future: sched.slice(g)};
}

const LANGS = ['English','Arabic','Dari','Pashto','Farsi','Kurdish (Sorani)','Urdu','Ukrainian','Russian','Polish','Romanian','Albanian','Tigrinya','Somali','Amharic','Portuguese','Spanish','French'];
const blankOf = v=> v.blank ?? (v.options ? {mmr:0,mmrv:0} : 0);
function evaluate(){
  const a = ageWeeks();
  const res = V.map(v=>{
    const raw = state.records==='no' ? '?' : (state.doses[v.id] ?? '?');
    const g = raw==='?' ? blankOf(v) : raw;
    const r = v.rule(a,g);
    const given = v.count ? v.count(g) : typeof g==='object' ? g.mmr+g.mmrv : g;
    const lastDate = !v.custom && raw!=='?' && given>0 ? (state.last[v.id] ?? null) : null;
    return {v, given, raw:g, unknown: raw==='?' && !v.noAsk, lastDate, lastUnknown: !v.custom && raw!=='?' && given>0 && lastDate===null, ...r, name:r.name||v.name, what:r.what||v.what};
  });
  const byId = Object.fromEntries(res.map(r=>[r.v.id,r]));
  // From 10: the Td/IPV catch up course replaces the teenage booster for now
  if(a>=yr(10) && byId.hex.status==='missing' && byId.td.status!=='done')
    Object.assign(byId.td,{status:'na', future:undefined, note:'Not needed yet. First Td/IPV booster is about 5 years after the catch up course.'});
  return res;
}

// UKHSA: 4 week gap between visits, fewest visits, resume courses rather than restart.
// Doses go onto a 4 weekly visit grid from today. Anything more than 12 weeks out goes under "later".
const HORIZON = 12;
function plan(res){
  const T = todayUTC(), visits = {}, lastHexK = {k:-1}; let later = [], lastHex = null;
  const byId = Object.fromEntries(res.map(r=>[r.v.id,r]));
  const deferPre = byId.pre.status==='missing' && byId.hex.status==='missing';

  res.filter(r=>r.status==='missing' || r.status==='upcoming').forEach(r=>{
    if(r.v.id==='pre' && deferPre) return;
    let dose = r.startDose ?? r.given, prev = r.lastDate ?? null, gone = false, first = true;
    const put = (k,extra={},earliest=T)=>{
      (visits[k] ||= []).push({...r, ...extra, dose:++dose, earliest, checkGap: first && r.lastUnknown});
      first = false; prev = addDays(T,k*28); if(r.v.id==='hex'){ lastHexK.k = k; lastHex = prev; }
    };
    // Explicit dose list (MMR/MMRV): each dose has a name, an age or a date, and goes at least 4 weeks after the last
    if(r.doses){
      r.doses.forEach(d=>{
        const base = d.date!==undefined ? (typeof d.date==='number' ? d.date : isoUTC(d.date)) : (d.w ? fromDob(d.w) : T);
        const after = prev===null ? T : d.gapM ? addMonths(prev,d.gapM) : addDays(prev, d.gapD ?? 28);
        const earliest = Math.max(base, after, T);
        const extra = {name:d.name||r.name, note:d.note||r.note, pill:d.pill ?? r.pill, by:d.by};
        const k = Math.max(0, Math.ceil((earliest-T)/(28*DAY)));
        if(!gone && k*4<=HORIZON) put(k, extra, earliest);
        else { gone = true; later.push({...r, ...extra, dose:++dose, when:earliest}); prev = earliest; }
      });
      return;
    }
    for(let j=0;j<(r.missing||0);j++){
      const earliest = prev===null ? T : Math.max(T, addDays(prev,28));
      put(Math.ceil((earliest-T)/(28*DAY)), {}, earliest);
    }
    (r.future||[]).forEach(w=>{
      let earliest = Math.max(fromDob(w), prev!==null ? addDays(prev,28) : T);
      if(r.v.id==='pre' && lastHex!==null) earliest = Math.max(earliest, addMonths(lastHex,12));
      // Rotavirus can't be given from 24 weeks
      if(r.v.id==='rota' && earliest>=fromDob(24)) return;
      const k = Math.ceil((earliest-T)/(28*DAY));
      if(!gone && k*4<=HORIZON) put(k, {}, earliest);
      else { gone = true; later.push({...r, dose:++dose, when:earliest}); prev = earliest; if(r.v.id==='hex') lastHex = earliest; }
    });
  });
  // Pre-school booster: from 3 years 4 months and at least a year after the last 6-in-1
  if(deferPre)
    later.push({...byId.pre, dose:1, when: Math.max(addMonths(T+lastHexK.k*28*DAY, 12), fromDob(mo(40))), note:'At least a year after the last 6-in-1 dose.'});
  // keep the routine list to the next 15 years, so a 30 year old isn't shown their 65th birthday jabs
  later = later.filter(r=> r.when < addMonths(T,180));
  later.sort((x,y)=>x.when-y.when);
  const list = Object.keys(visits).map(Number).sort((x,y)=>x-y)
    .map((k,i)=>({off:k*4, i, date: Math.max(...visits[k].map(x=>x.earliest)), items: visits[k]}));
  return {visits:list, later};
}

function ageText(a){
  if(a<13) return `${Math.floor(a)} weeks`;
  // whole calendar months, so 8 August to 8 October is exactly 2 months
  const d = new Date(state.dob.getTime()), t = new Date(todayUTC());
  const m = (t.getUTCFullYear()-d.getUTCFullYear())*12 + (t.getUTCMonth()-d.getUTCMonth()) - (t.getUTCDate()<d.getUTCDate()?1:0);
  if(m<24) return `${m} months`;
  const y = Math.floor(m/12), r = m%12;
  return `${y} years${r?` ${r} month${r>1?'s':''}`:''}`;
}

const doseLabel = d=> d===undefined ? 'Not answered' : d==='?' ? 'Not known' : d===0 ? 'None' : `${d} dose${d>1?'s':''}`;

/* ---------- validation ---------- */
function dobErrors(){
  const {dd,mm,yyyy} = state;
  state.dob = null;
  if(!dd && !mm && !yyyy) return "Enter the date of birth";
  const missing = [!dd&&'day',!mm&&'month',!yyyy&&'year'].filter(Boolean);
  if(missing.length) return `Date of birth must include a ${missing.join(' and ')}`;
  if(yyyy.length!==4) return 'Year must include 4 numbers';
  const d=+dd, m=+mm, y=+yyyy, dt=new Date(Date.UTC(y,m-1,d));
  if(dt.getUTCFullYear()!==y || dt.getUTCMonth()!==m-1 || dt.getUTCDate()!==d) return 'Date of birth must be a real date';
  if(dt.getTime()>todayUTC()) return 'Date of birth must be in the past';
  state.dob = dt;
  if(ageWeeks()>=yr(120)){ state.dob=null; return 'Date of birth must be a real date'; }
  return '';
}

function dateFields(key, label, hint, err){
  const v = state.din[key] || {};
  const f = (p,cls,lab,len,nx,pv)=>`<div><label for="${key}-${p}">${lab}</label><input id="${key}-${p}" class="${cls}" data-dk="${key}" data-dp="${p}"${nx?` data-next="${key}-${nx}"`:''}${pv?` data-prev="${key}-${pv}"`:''} inputmode="numeric" maxlength="${len}" autocomplete="off" value="${esc(v[p]||'')}"></div>`;
  return `<div class="dgroup${err?' error':''}">

// Returns {ms}, {empty:true} or {error} for a set of date fields
function readDate(key){
  const v = state.din[key] || {}, d = v.d||'', m = v.m||'', y = v.y||'';
  if(!d && !m && !y) return {empty:true};
  const miss = [!d&&'day',!m&&'month',!y&&'year'].filter(Boolean);
  if(miss.length) return {error:`must include a ${miss.join(' and ')}`};
  if(y.length!==4) return {error:'year must include 4 numbers'};
  const t = Date.UTC(+y,+m-1,+d), dt = new Date(t);
  if(dt.getUTCFullYear()!==+y || dt.getUTCMonth()!==+m-1 || dt.getUTCDate()!==+d) return {error:'must be a real date'};
  if(t>todayUTC()) return {error:'must be today or in the past'};
  if(state.dob && t<state.dob.getTime()) return {error:'must be on or after their date of birth'};
  return {ms:t};
}

    return `<section class="vcard ${today?'today':''}" aria-labelledby="vh${v.i}">

        <span class="vdate">${today?fmt(v.date):`From ${fmt(v.date)}, ${inTime(v.date)}`}</span></div>
        <span class="vcount">${n} vaccine${n>1?'s':''}</span></div>
      <ul class="vlist">${v.items.map(row).join('')}</ul></section>`;
  };

  return `${caption()}<p class="summary">${doses ? `${doses} dose${doses>1?'s':''} over ${p.visits.length} visit${p.visits.length>1?'s':''}` : 'Up to date'}</p>
    <p class="sub-lead">${doses ? (unknown ? `${unknown} vaccine${unknown>1?'s are':' is'} in the plan because there's no record. Worth checking for paperwork first.` : 'Based on the records entered.') : 'Nothing to catch up on right now.'}</p>
`+
    (fluBanner(a) ? `<div class="flu"><strong>Flu season.</strong> ${fluBanner(a)}</div>` : '')+
    (p.visits.length ? `<div class="visits">${p.visits.map(visitCard).join('')}</div>` : '')+
    (p.later.length ? `<section class="later" aria-labelledby="laterHead"><h2 id="laterHead">Later, as routine</h2>
      <ul class="llist">${p.later.map(r=> laterSchool(r) ? `<li><span class="ldate">Year ${r.v.school}</span><span class="lmain"><strong>${esc(r.name)}</strong><span class="what">${esc(r.what)}</span><span class="note">School programme, ${schoolYearText(r.v.school)}. Check nearer the time, as programmes change.</span></span></li>` : `<li><span class="ldate">${short(r.when)}</span><span class="lmain"><strong>${esc(r.name)}</strong><span class="what">${esc(r.what)}</span>${r.note?`<span class="note">${esc(r.note)}</span>`:''}</span></li>`).join('')}</ul></section>` : '')+
    (done.length ? `<details><summary>Up to date (${done.length})</summary>${done.map(r=>item(r,'Done')).join('')}</details>` : '')+
    (na.length ? `<details><summary>Not needed at this age (${na.length})</summary>${na.map(r=>item(r,'')).join('')}</details>` : '')+
    `<div class="restart"><button class="btn" data-action="restart">Clear and start again</button></div>
    <div class="sources"><p class="small" style="margin:24px 0 8px">Prototype only, not for clinical use. Simplified from:</p><ul>${SOURCES.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ul><p class="small">Doesn't cover clinical risk groups or immunosuppression. Each planned dose is at least 28 days after the most recent dose entered, counting the day of a dose as day 0.</p></div>
`;
}

function setView(v, trigger){

// Orphan fallback for browsers without text-wrap:pretty: glue the last two words together
if(!(window.CSS && CSS.supports && CSS.supports('text-wrap','pretty'))){
  const glue = root=>{ root.querySelectorAll('p,li,h1,h2,h3,.lead,.hint,label,legend').forEach(el=>{
    if(el.dataset.glued) return;
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); let last=null; while(w.nextNode()){ if(w.currentNode.nodeValue.trim()) last=w.currentNode; }
    if(last && el.textContent.trim().split(/\s+/).length>3){ const v=last.nodeValue, i=v.replace(/\s+$/,'').lastIndexOf(' '); if(i>0) last.nodeValue=v.slice(0,i)+'\u00A0'+v.slice(i+1); }
    el.dataset.glued='1'; }); };
  let q=0; new MutationObserver(()=>{ if(!q){ q=setTimeout(()=>{ q=0; glue(document.body); },0); } }).observe(document.body,{childList:true,subtree:true});
  glue(document.body);
}

  const vlist = shownVax(), vi = vlist.findIndex(v=>v.id===key);

  else { const list = shownVax(); const v = list.find(x=>x.id===key); html += pageVax(v, list.indexOf(v)+1, list.length); }
  m.innerHTML = html;
  $('pageTitle').innerHTML = key==='dob' ? '<h1 class="page-title">About the patient</h1>'
    : key==='check' ? '<h1 class="page-title">Check your answers</h1>'
    : key==='results' ? '' : '<h2 class="page-title">Vaccine information</h2>';
  { const es = m.querySelector('#errSummary'); if(es) $('pageTitle').appendChild(es); }

    $('openHandout').textContent = lbl; $('handoutTitle').textContent = lbl; $('handoutSheet').setAttribute('aria-label', lbl); }

}

function heroHome(){
  const photo = HERO_IMG ? `<img src="${HERO_IMG}" alt="A nurse in blue gloves holding cotton wool on a boy’s upper arm after a vaccination">` : `<span class="hero-ph">Photo</span>`;
  return `<section class="hero">
    <div class="wrap hero-inner">
      <div class="hero-copy">
        <h1>Plan catch&#8209;up vaccines when records are missing<a class="fn" href="#clinicalNote" data-fn aria-label="Read the note on clinical judgement">*</a></h1>
        <p class="lead">For practice nurses seeing a child or adult whose vaccine records are incomplete or unknown, such as someone who has just arrived in the UK.</p>
        <button class="btn hero-btn" data-goview="check">Start a check</button>
      </div>
      <div class="hero-media">
                <div class="hero-photo">${photo}</div>
        <section class="hero-float"><span class="hp-ico c3"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span><div><h2>Based on UKHSA guidance</h2><p>Including the MMRV changes and the chickenpox catch-up. <button class="linkbtn" data-goview="updates">See recent updates</button></p></div></section>
      </div>
    </div>
  </section>`;
}
function pageHome(){
  return `<div class="info home">
    <aside class="home-banner" id="clinicalNote" tabindex="-1" role="note" aria-label="Clinical responsibility">
      <p><span class="hb-ast" aria-hidden="true">*</span>This tool supports, but does not replace, clinical judgement. Always check results against the current Green Book and UKHSA guidance before vaccinating. The person giving the vaccine remains responsible for the decision and must be working under a valid PGD, PSD or prescription.</p>
    </aside>
  
  </div>`;
}
function pageMore(){
  const link = (v,title,text)=>`<li><button class="more-link" data-goview="${v}"><span><b>${title}</b><span>${text}</span></span><svg class="more-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></li>`;
  return `<div class="info">
    <h1>More</h1>
    <ul class="more-list">
      ${link('about','About Vax Gap','How it works, where the rules come from and what it doesn\'t cover')}
      ${link('updates','Guidance updates','Recent and upcoming changes to UKHSA guidance')}
    </ul>
    <h2>Clinical responsibility</h2>
    <p>This tool supports, but does not replace, clinical judgement. Always check results against the current Green Book and UKHSA guidance before vaccinating. The person giving the vaccine remains responsible for the decision and must be working under a valid PGD, PSD or prescription.</p>
  </div>`;
}
function pageAbout(){
  return `<div class="info">
    <h1>About Vax Gap</h1>
    <p class="lead">Vax Gap helps practice nurses plan catch-up vaccines for children and adults whose records are missing or incomplete, such as people who have just arrived in the UK.</p>
    <h2>How it works</h2>
    <p>You enter the patient's date of birth and whatever doses are on their record. Anything without a record is treated as not given, which is the UKHSA approach for unknown history. Vax Gap then sets out what to give today, what to give at later visits 4 weeks apart, and what comes later on the routine schedule.</p>
    <h2>Where the rules come from</h2>
    <p>The rules follow UKHSA guidance for England:</p>
    <ul>${SOURCES.map(x=>`<li><a href="${x.url}" target="_blank" rel="noopener">${esc(x.title)}</a></li>`).join('')}</ul>
    <h2>What it doesn't cover yet</h2>
    <ul>
      <li>Clinical risk groups and immunosuppression</li>
      <li>Vaccines in pregnancy, and flu for adults under 65 in risk groups</li>
      <li>Checks that need the date of every earlier dose, apart from MenB, which asks for them</li>
      <li>Single chickenpox vaccines given abroad</li>
      <li>Selective programmes such as BCG and hepatitis B for at risk babies</li>
    </ul>
    <h2>Your data</h2>
    <p>Nothing is saved or sent anywhere. Answers stay on this screen until you clear them or close the page. The patient handout comes in 17 languages, built into the page. They're drafts made with Claude and haven't yet been checked by a translator.</p>
    <h2>Status</h2>
    <p>Vax Gap is a prototype and isn't for clinical use. Always check a plan against the Green Book and your local screening and immunisation team.</p>
  </div>`;
}
function pageUpdates(){
  const item = (iso,label,title,text,soon)=>`<li${soon?' class="soon"':''}><time datetime="${iso}">${label}</time><div><b>${title}</b><span>${text}</span></div></li>`;
  return `<div class="info">
    <h1>Guidance updates</h1>
    <p class="lead">Changes to the UKHSA guidance Vax Gap follows.</p>
    <ul class="log">
      ${item('2026-11-01','1 Nov 2026','MMRV chickenpox catch-up starts','Children born 1 January 2020 to 31 August 2022 are offered one MMRV dose, until 31 March 2028.',true)}
      ${item('2026-12-31','31 Dec 2026','Last date for a first dose in the MenB time-limited offer','Second doses can be given until 31 March 2027.',true)}
      ${item('2026-10-01','1 Oct 2026','Uncertain or incomplete immunisation algorithm updated','UKHSA updated the algorithm Vax Gap follows for catch-up plans.')}
      ${item('2026-09-24','24 Sep 2026','Complete routine schedule from September 2026','New version of the UK routine schedule published.')}
      ${item('2026-08-25','25 Aug 2026','MMRV guidance for healthcare professionals updated','Covers eligibility by date of birth and what to give children who are behind.')}
      ${item('2026-07-20','20 Jul 2026','MenB time-limited offer starts','Two doses of Bexsero for people born 1 September 2007 to 31 August 2008, and for those under 25 starting university or residential further education this autumn.')}
      ${item('2026-07-16','16 Jul 2026','JCVI advises a routine MenB offer for teenagers','Advice to the government on MenB vaccination around 15 years of age. Not yet part of the routine schedule.')}
      ${item('2026-01-01','1 Jan 2026','MMRV replaces MMR and new 18 month appointment','MMRV at 12 and 18 months. A fourth 6-in-1 dose at 18 months for children born from 1 July 2024.')}
      ${item('2025-07-01','1 Jul 2025','Infant schedule changes','Second MenB moved to 12 weeks and PCV to 16 weeks. Hib/MenC stopped for children born from 1 July 2024.')}
    </ul>
  </div>`;
}
function pageSchedule(){
  const row = (age, items)=>`<li><span class="sch-age">${age}</span><ul class="sch-items">${items.map(([n,w,f])=>`<li><div><b>${n}</b>${f?`<small class="sch-for">${f}</small>`:''}</div><span>${w}</span></li>`).join('')}</ul></li>`;
  return `<div class="info schedule">
    <h1>UK routine schedule</h1>
    <p class="lead">Quick reference for England. Always check the full UKHSA schedule and the Green Book.</p>
    <nav class="gov-related" aria-labelledby="relHead">
      <h2 id="relHead">Official guidance</h2>

function go(i){ view='check'; document.querySelectorAll('.appnav [data-view], .tabbar [data-view]').forEach(b=> b.dataset.view==='check' ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current')); state.step=i; state.errors=null; window.scrollTo(0,0); render(); if(!$('errSummary')) $('main').focus({preventScroll:true}); }

function next(){
  const st = steps(), key = st[state.step];
  if(key==='dob'){
    const e = {dob: dobErrors() || null, records: state.records ? null : 'Select yes if they have any vaccine records'};
    if(e.dob || e.records){ state.errors = e; return render(); }
  }
  else if(key==='menbteen'){
    const cur = state.doses.menbteen, e = {};
    if(cur===undefined) e.type = 'Select whether they have had a MenB vaccine, or not known';
    else if(cur!=='?' && cur.type!=='none'){
      const keys = cur.type==='trumenba' ? ['mb1','mb2','mb3'] : ['mb1','mb2'];
      const names = {mb1:'first',mb2:'second',mb3:'third'}, got = [];
      keys.forEach((k,ix)=>{
        const r = readDate(k);
        if(r.empty){ if(ix===0) e[k] = 'Enter the date of the first dose'; return; }
        if(r.error){ e[k] = `Date of ${names[k]} dose ${r.error}`; return; }
        if(ix>0 && got.length!==ix){ e[k] = `Enter the date of the ${names[keys[ix-1]]} dose first`; return; }
        if(ix>0 && r.ms<=got[ix-1]){ e[k] = `Date of ${names[k]} dose must be after the ${names[keys[ix-1]]} dose`; return; }
        got.push(r.ms);
      });
      if(!Object.keys(e).length) cur.dates = got;
    }
    if(Object.keys(e).length){ state.errors = e; return render(); }
  }
  else if(V.some(v=>v.id===key)){
    const v = V.find(x=>x.id===key), cur = state.doses[key];
    if(cur===undefined){ state.errors = {dose: key==='mmrv' ? 'Select which measles vaccines are on the record, or not known' : `Select how many doses are on the record, or not known`}; return render(); }
    const total = cur && typeof cur==='object' ? cur.mmr+cur.mmrv : (typeof cur==='number' ? cur : 0);
    if(total>0){
      const r = readDate('last-'+key);
      if(r.error){ state.errors = {last:`Date of the most recent dose ${r.error}`}; return render(); }
      state.last[key] = r.ms ?? null;
    } else delete state.last[key];
  }
  const nst = steps();
  if(state.fromCheck){
    const gap = state.records==='yes' ? shownVax().find(v=>state.doses[v.id]===undefined) : null;
    if(gap){ state.fromCheck=false; return go(nst.indexOf(gap.id)); }
    state.fromCheck=false; return go(nst.indexOf('check'));
  }
  go(nst.indexOf(key)+1);
}

/* ---------- events ---------- */
$('main').addEventListener('input',e=>{
  const id = e.target.id;
  if(e.target.dataset.dk){
    const k = e.target.dataset.dk, p = e.target.dataset.dp;
    const v = e.target.value = e.target.value.replace(/\D/g,'');
    (state.din[k] ||= {})[p] = v;
    if(e.inputType && e.inputType.startsWith('delete')) return;
    const full = p==='d' ? (v.length===2 || (v.length===1 && +v>3)) : p==='m' ? (v.length===2 || (v.length===1 && +v>1)) : false;
    if(full && e.target.dataset.next){ const nxt = $(e.target.dataset.next); nxt.focus(); nxt.select(); }
    return;
  }
  if(['dd','mm','yyyy'].includes(id)){
    const v = e.target.value = e.target.value.replace(/\D/g,'');
    state[id] = v;
    // Jump to the next field once the value can't get any longer (e.g. 15, or 4 for a day, 2 for a month)
    if(e.inputType && e.inputType.startsWith('delete')) return;
    const full = id==='dd' ? (v.length===2 || (v.length===1 && +v>3)) : id==='mm' ? (v.length===2 || (v.length===1 && +v>1)) : false;
    if(full){ const nxt = $(id==='dd'?'mm':'yyyy'); nxt.focus(); nxt.select(); }
  }
});
$('main').addEventListener('change',e=>{
  if(e.target.name==='records'){ state.records = e.target.value; const st=steps(); if(st[state.step]==='dob'){ if(state.errors) state.errors.records=null; render(); document.querySelector(`input[value="${state.records}"]`).focus(); } }
  if(e.target.name==='dose'){
    const key = steps()[state.step], val = e.target.value;
    state.doses[key] = val==='?' ? '?' : val.includes('-') ? {mmr:+val.split('-')[0], mmrv:+val.split('-')[1]} : +val;
    if(state.errors) state.errors.dose = null;
    render(); document.querySelector(`input[name="dose"][value="${val}"]`)?.focus();
  }
  if(e.target.name==='mbtype'){
    const val = e.target.value;
    state.doses.menbteen = val==='?' ? '?' : {type:val, dates:[]};
    if(state.errors) state.errors.type = null;
    render(); document.querySelector(`input[name="mbtype"][value="${val}"]`)?.focus();
  }
});
$('main').addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.matches('input')){ e.preventDefault(); next(); }
  // Backspace in an empty field goes back to the previous one
  const prev = {mm:'dd', yyyy:'mm'}[e.target.id] || e.target.dataset.prev;
  if(e.key==='Backspace' && prev && e.target.value===''){ e.preventDefault(); $(prev).focus(); }
});
$('main').addEventListener('click',e=>{
  const a = e.target.closest('a[href^="#"]');
  if(a){ e.preventDefault(); const t=document.querySelector(a.getAttribute('href')); if(t) t.focus(); return; }
  const b = e.target.closest('button'); if(!b) return;
  const act = b.dataset.action;
  if(act==='continue') next();
  if(act==='back'){ const st=steps(); state.fromCheck=false; go(st[state.step]==='results' ? st.indexOf('check') : state.step-1); }
  if(act==='restart') askRestart(b);
  if(b.dataset.goto!==undefined){ state.fromCheck = true; go(+b.dataset.goto); }
  if(b.dataset.preset){
    const d = new Date();
    if(b.dataset.preset==='a'){ d.setFullYear(d.getFullYear()-7); d.setMonth(d.getMonth()-2); state.records='no'; }
    else { d.setMonth(d.getMonth()-14); state.records='yes'; state.doses={hex:2,menb:1,pcv:'?',mmrv:{mmr:0,mmrv:0}}; }
    Object.assign(state,{dd:String(d.getDate()),mm:String(d.getMonth()+1),yyyy:String(d.getFullYear())});
    dobErrors(); go(steps().indexOf('check'));
  }
});

function notesText(res,p){
  const a = ageWeeks();
  const recorded = res.filter(r=>!r.unknown && r.given>0).map(r=> (r.v.custom ? r.v.label(r.raw)
    : typeof r.raw==='object' ? [r.raw.mmr?`MMR x${r.raw.mmr}`:'', r.raw.mmrv?`MMRV x${r.raw.mmrv}`:''].filter(Boolean).join(', ')
    : `${r.v.name} x${r.given}`) + (r.lastDate ? ` (last ${fmtNum(r.lastDate)})` : ''));
  const unknown = res.filter(r=>r.unknown && r.v.sched[0]<=a && r.status!=='na' && r.status!=='hidden').map(r=>r.v.name);
  const lines = [
    'Immunisation catch up check (UK schedule, Jan 2026)',
    `DOB ${fmtNum(state.dob)} (aged ${ageText(a)})`,
    `Records available: ${state.records==='no'?'None':'Yes'}`,
    `Recorded doses: ${recorded.join(', ')||'None'}`,
    `No record, treated as not given: ${unknown.join(', ')||'None'}`,
    '', 'Plan:',
    ...p.visits.map(v=>`${v.off===0?'Today':`Visit ${v.i+1} from`} ${fmtNum(v.date)}: ${v.items.map(r=>`${r.name} (dose ${r.dose})`).join(', ')}`),
    ...(p.later.length?['','Routine, later:',...p.later.map(r=> laterSchool(r) ? `${r.name}: Year ${r.v.school} school programme (${schoolYearText(r.v.school)})` : `${r.name} from ${fmtNum(r.when)}`)]:[]),
    '', `Not indicated at this age: ${res.filter(r=>r.status==='na'&&r.v.sched[0]<=a).map(r=>r.name).join(', ')||'None'}`,
  ];
  if(fluSeason(a)) lines.push('Seasonal flu: eligible, check if given this season');
  lines.push('', 'Based on UKHSA uncertain or incomplete immunisation status algorithm (Oct 2026) and complete routine schedule (Sept 2026).');
  return lines.join('\n');
}
function openNotes(res,p){ $('notesText').value = notesText(res,p); $('copyBtn').textContent='Copy text'; $('notesSheet').hidden=false; }

function fmtLang(ms, lang){
  const loc = LANG_LOCALE[lang];
  if(!loc) return fmt(ms);
  try{
    if(Intl.DateTimeFormat.supportedLocalesOf([loc]).length)
      return new Intl.DateTimeFormat(loc+'-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(ms));
  }catch{}
  return fmtNum(ms);
}

  const dis = w=> DIS_KEY[w] ? t(DIS_KEY[w]) : `Protects against ${w.charAt(0).toLowerCase()+w.slice(1)}.`;
  return {
    title: t(h.child ? 'title_child' : 'title_adult'),
    lead: t(h.child ? 'lead_child' : 'lead_adult'),
    sections: h.sections.map(s=>({
      heading: s.kind==='later' ? t('later') : t(s.kind, {date: fmtLang(s.date, lang)}),
      items: s.items.map(i=>({name:i.name, what: i.school ? `${t('school',{n:i.school.n, y1:i.school.y1, y2:i.school.y1+1})} ${dis(i.what)}`

function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
  document.body.appendChild(ta);
  const back = document.activeElement;
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch{ ok = false; }
  ta.remove(); back?.focus?.();
  return ok;
}

$('confirmCancel').onclick = closeRestart;
$('confirmOk').onclick = ()=>{ $('confirm').hidden = true; state = fresh();
  if(leaveTo){ const v = leaveTo; leaveTo = null; setView(v); } else go(0); };
$('confirmCopy').onclick = async ()=>{
  const btn = $('confirmCopy');
  const ok = await copyNotes(null);
  if(ok){ btn.textContent = 'Copied'; btn.disabled = true; $('toast').hidden = true; $('confirmOk').focus(); }
  else $('confirm').hidden = true;
};
$('confirm').addEventListener('keydown',e=>{
  if(e.key==='Escape') closeRestart();
  if(e.key==='Tab'){ // keep focus inside the dialog
    const f = [...$('confirm').querySelectorAll('button:not([hidden])')];
    const i = f.indexOf(document.activeElement);
    if(e.shiftKey && i===0){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && i===f.length-1){ e.preventDefault(); f[0].focus(); }
  }
});
$('confirm').addEventListener('click',e=>{ if(e.target===$('confirm')) closeRestart(); });

window.addEventListener('scroll',()=>document.querySelector('.topbar').classList.toggle('scrolled', window.scrollY>4),{passive:true});
render();
</script>
